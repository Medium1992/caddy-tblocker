name: Update Caddy and publish image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when Caddy has not changed
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "tblocker.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/publish.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: caddy-tblocker-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caddy-tblocker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read the latest Caddy release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          caddy_version=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)
          test -n "$caddy_version" && test "$caddy_version" != "null"
          echo "caddy_version=$caddy_version" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${caddy_version#v}" >> "$GITHUB_OUTPUT"

      - name: Decide whether a scheduled build is needed
        id: decision
        env:
          LATEST: ${{ steps.upstream.outputs.caddy_version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^caddy=//p' VERSIONS)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST" != "$current" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up latest stable Go
        if: steps.decision.outputs.build == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Update and test the Caddy dependency
        if: steps.decision.outputs.build == 'true'
        env:
          CADDY_VERSION: ${{ steps.upstream.outputs.caddy_version }}
        run: |
          set -euo pipefail
          go get "github.com/caddyserver/caddy/v2@${CADDY_VERSION}"
          go mod tidy
          go test ./...
          go vet ./...
          printf 'caddy=%s\n' "$CADDY_VERSION" > VERSIONS

      - name: Set build metadata
        if: steps.decision.outputs.build == 'true'
        id: metadata
        env:
          CADDY_VERSION: ${{ steps.upstream.outputs.caddy_version }}
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "custom_version=${CADDY_VERSION}-tblocker.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.decision.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish multi-architecture image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_DOCKER_TAG=${{ steps.upstream.outputs.docker_tag }}
            CADDY_VERSION=${{ steps.upstream.outputs.caddy_version }}
            CUSTOM_VERSION=${{ steps.metadata.outputs.custom_version }}
            VCS_REF=${{ steps.metadata.outputs.revision }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.caddy_version }}

      - name: Commit updated upstream version
        if: steps.decision.outputs.build == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum VERSIONS
          git commit -m "chore: update Caddy to ${{ steps.upstream.outputs.caddy_version }}" || exit 0
          git push
