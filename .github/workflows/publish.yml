name: Update Caddy and publish image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  packages: write

concurrency:
  group: caddy-tblocker-publish
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: medium1992/caddy-tblocker
  GHCR_IMAGE: ghcr.io/medium1992/caddy-tblocker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read the latest Caddy release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          caddy_version=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)
          test -n "$caddy_version" && test "$caddy_version" != "null"
          echo "caddy_version=$caddy_version" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${caddy_version#v}" >> "$GITHUB_OUTPUT"

      - name: Set up latest stable Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Read the Go toolchain version
        id: toolchain
        run: |
          set -euo pipefail
          go_version=$(go version | awk '{print $3}' | sed 's/^go//')
          test -n "$go_version"
          echo "go_version=$go_version" >> "$GITHUB_OUTPUT"

      - name: Decide whether a scheduled build is needed
        id: decision
        env:
          LATEST: ${{ steps.upstream.outputs.caddy_version }}
          GO_VERSION: ${{ steps.toolchain.outputs.go_version }}
        run: |
          set -euo pipefail
          current_caddy=$(sed -n 's/^caddy=//p' VERSIONS)
          current_go=$(sed -n 's/^go=//p' VERSIONS)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST" != "$current_caddy" ] || [ "$GO_VERSION" != "$current_go" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and test the Caddy dependency
        if: steps.decision.outputs.build == 'true'
        env:
          CADDY_VERSION: ${{ steps.upstream.outputs.caddy_version }}
        run: |
          set -euo pipefail
          go get "github.com/caddyserver/caddy/v2@${CADDY_VERSION}"
          go mod tidy
          go test -race ./...
          go vet ./...
          printf 'caddy=%s\ngo=%s\n' "$CADDY_VERSION" "${{ steps.toolchain.outputs.go_version }}" > VERSIONS

      - name: Set build metadata
        if: steps.decision.outputs.build == 'true'
        id: metadata
        env:
          CADDY_VERSION: ${{ steps.upstream.outputs.caddy_version }}
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "custom_version=${CADDY_VERSION}-tblocker.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.decision.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.decision.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: steps.decision.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        if: steps.decision.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_DOCKER_TAG=${{ steps.upstream.outputs.docker_tag }}
            GO_VERSION=${{ steps.toolchain.outputs.go_version }}
            CADDY_VERSION=${{ steps.upstream.outputs.caddy_version }}
            CUSTOM_VERSION=${{ steps.metadata.outputs.custom_version }}
            VCS_REF=${{ steps.metadata.outputs.revision }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.upstream.outputs.caddy_version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.upstream.outputs.caddy_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit updated upstream version
        if: steps.decision.outputs.build == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum VERSIONS
          git commit -m "chore: update Caddy to ${{ steps.upstream.outputs.caddy_version }}" || exit 0
          git push

      - name: Install jq and crane
        if: steps.decision.outputs.build == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -C /usr/local/bin -xz crane
          crane version

      - name: Log in to GHCR with crane
        if: steps.decision.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | crane auth login ghcr.io -u medium1992 --password-stdin

      - name: Analyze untagged GHCR versions
        if: steps.decision.outputs.build == 'true'
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: medium1992
          PACKAGE_NAME: caddy-tblocker
          PACKAGE_NAME_ENCODED: caddy-tblocker
        run: |
          set -euo pipefail

          packages_json='[]'
          last_first_id=''
          for page in $(seq 1 10); do
            chunk=$(timeout 30s gh api -H "Accept: application/vnd.github+json" \
              "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME_ENCODED}/versions?per_page=100&page=${page}")
            chunk_count=$(echo "$chunk" | jq length)
            [ "$chunk_count" -eq 0 ] && break

            first_id=$(echo "$chunk" | jq -r '.[0].id // ""')
            [ -n "$last_first_id" ] && [ "$first_id" = "$last_first_id" ] && break
            last_first_id="$first_id"
            packages_json=$(jq -s '.[0] + .[1]' <(echo "$packages_json") <(echo "$chunk"))
          done

          declare -A protected_digests=()
          declare -A manifest_seen=()

          while IFS=$'\t' read -r id digest tags; do
            [ -z "$id" ] && continue
            protected_digests["$digest"]=1
            if [ -z "${manifest_seen[$digest]+x}" ]; then
              manifest_seen["$digest"]=1
              manifest=$(timeout 10s crane manifest "ghcr.io/${PACKAGE_OWNER}/${PACKAGE_NAME}@${digest}" 2>/dev/null || echo '{}')
              while IFS= read -r child_digest; do
                [ -n "$child_digest" ] && protected_digests["$child_digest"]=1
              done < <(echo "$manifest" | jq -r '(.manifests // [])[].digest // empty')
            fi
            echo "Keeping tagged manifest ${id}: ${tags}"
          done < <(echo "$packages_json" | jq -r '
            .[] | select((.metadata.container.tags // []) | length > 0) |
            [.id, .name, ((.metadata.container.tags // []) | join(", "))] | @tsv')

          candidates=()
          while IFS=$'\t' read -r id digest; do
            [ -z "$id" ] && continue
            if [ -n "${protected_digests[$digest]+x}" ]; then
              echo "Keeping referenced platform manifest ${id}: ${digest}"
            else
              candidates+=("$id")
              echo "Deleting untagged manifest ${id}: ${digest}"
            fi
          done < <(echo "$packages_json" | jq -r '
            .[] | select((.metadata.container.tags // []) | length == 0) |
            [.id, .name] | @tsv')

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "ids=" >> "$GITHUB_OUTPUT"
          else
            ids=$(IFS=,; echo "${candidates[*]}")
            echo "ids=${ids}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete safe untagged GHCR versions
        if: steps.decision.outputs.build == 'true' && steps.cleanup.outputs.ids != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: caddy-tblocker
          package-type: container
          package-version-ids: ${{ steps.cleanup.outputs.ids }}
          token: ${{ github.token }}
